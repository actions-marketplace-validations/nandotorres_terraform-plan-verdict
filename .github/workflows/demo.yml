name: Demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "src/**"
      - "dist/**"
      - "action.yml"

permissions: {}

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario: [low, medium, high, critical]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          disable-sudo: true
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Generate a real plan (offline, no cloud)
        run: ./examples/generate-plan.sh examples/${{ matrix.scenario }}

      - name: Score with the local action (free rules provider)
        uses: ./
        with:
          plan-json: examples/${{ matrix.scenario }}/plan.json
          provider: rules
          comment: false
          labels: false
          summary: true
          fail-on: none
